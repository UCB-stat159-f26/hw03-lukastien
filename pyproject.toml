[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisplot"
version = "0.1.0"
description = "Fetch tennis career data from tennisabstract.com and plot player age vs. opponent age difference."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas", "matplotlib", "requests"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]